<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Los Olivos</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#fff;
}

header{
  background:#1e3a8a;
  padding:20px;
  text-align:center;
}

h1{
  margin:0;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.section{
  margin-top:30px;
  padding:20px;
  border-radius:10px;
  background:#1e293b;
}

.section h2{
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
  gap:15px;
}

.card{
  background:#0f172a;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card h3{
  margin-bottom:10px;
}

.card p{
  font-size:13px;
  color:#ccc;
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:8px 15px;
  border-radius:5px;
  text-decoration:none;
  color:#fff;
}

.btn-blue{
  background:#2563eb;
}

.btn-green{
  background:#16a34a;
}
</style>
</head>

<body>

<header>
  <h1>📊 Dashboard de Encuestas Los Olivos</h1>
  <p>Sistema de reportes y análisis</p>
</header>
